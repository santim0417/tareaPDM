name: iupb_pdm_eventos_cercanos
description: "Aplicación Flutter para descubrir eventos cercanos en tiempo real consumiendo la API de Ticketmaster sobre un mapa interactivo (Evaluación 4 - PDM IUPB)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
